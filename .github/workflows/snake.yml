name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Parnia11235813
          outputs: |
            dist/github-snake.svg?color_snake=8FBC8F&color_dots=#161B22,#243126,#36543A,#527A55,#8FBC8F
            dist/github-snake-dark.svg?color_snake=8FBC8F&color_dots=#0D1117,#1A2A1D,#29452D,#527A55,#8FBC8F

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
